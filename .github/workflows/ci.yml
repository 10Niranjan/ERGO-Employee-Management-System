name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (tests + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm test

      # Clean today (0 high/critical) — a real gate, not just visibility.
      - run: npm audit --audit-level=high

  frontend:
    name: Frontend (lint + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Gated at critical only: vite/esbuild currently carries a known "high"
      # advisory (dev-server-only, no real prod exposure) deferred pending a
      # breaking vite@8 bump — see the security assessment. Tighten this back
      # to --audit-level=high once that bump happens.
      - run: npm audit --audit-level=critical
